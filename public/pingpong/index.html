<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ping Pong Counter | Ganesh Adhikari</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    h1 { font-size: 22px; margin: 10px 0; }
    .stage { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
    video { width: 100%; display: block; background: #000; object-fit: contain; }
    canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    button { font-size: 18px; padding: 12px 24px; margin: 8px; }
    button:disabled { opacity: 0.5; }
    .back { position: absolute; left: 12px; top: 12px; color: #14b8a6; text-decoration: none; font-size: 14px; }
    .hint { color: #888; font-size: 13px; margin: 6px; }

    #board { display: flex; justify-content: center; gap: 24px; margin: 12px 0; }
    .player { background: #222; border-radius: 12px; padding: 10px 20px; min-width: 110px; border: 2px solid transparent; }
    .player.serving { border-color: #ffd400; }
    .player.scored { animation: scored 0.8s ease-out; }
    @keyframes scored { from { background: #14b8a6; } to { background: #222; } }
    .player .name { font-size: 16px; color: #aaa; }
    .player .serve { color: #ffd400; visibility: hidden; }
    .player.serving .serve { visibility: visible; }
    .player .pts { display: block; font-size: 60px; font-weight: bold; }
    .player .games { font-size: 14px; color: #aaa; }
    .player button { font-size: 14px; padding: 6px 14px; margin: 6px 0 0; }
    #state { font-size: 18px; min-height: 24px; margin: 8px; }
    #note { color: #ffd400; font-weight: bold; min-height: 20px; margin: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
</head>
<body>
  <a class="back" href="/myapps.html">← MyApps</a>
  <h1>Ping Pong Counter</h1>
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <p class="hint">Phone at the side of the table, net in the middle. Tap the table surface right under the net to calibrate. Auto scoring starts after calibrating.</p>

  <div id="board">
    <div class="player" id="player0">
      <div class="name">P1 (left) <span class="serve">● serve</span></div>
      <span class="pts" id="pts0">0</span>
      <div class="games">Games: <b id="games0">0</b></div>
      <button data-player="0" class="plus">+1</button>
    </div>
    <div class="player" id="player1">
      <div class="name">P2 (right) <span class="serve">● serve</span></div>
      <span class="pts" id="pts1">0</span>
      <div class="games">Games: <b id="games1">0</b></div>
      <button data-player="1" class="plus">+1</button>
    </div>
  </div>
  <p id="note"></p>
  <p id="state"></p>

  <div>
    <button id="startBtn" disabled>Loading model…</button>
    <button id="autoBtn">Auto: on</button>
    <button id="serverBtn">Switch server</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset match</button>
  </div>
  <p id="status"></p>
  <p id="info"></p>

  <script>
    const MODEL_URL = "model/best.onnx";
    const SIZE = 640;       // model input size (matches training imgsz)
    const CONF_NEW = 0.45;  // confidence needed to start following a new ball
    const CONF_KEEP = 0.25; // lower confidence is fine for a ball we are already following
    const IOU = 0.45;       // overlap threshold for removing duplicate boxes
    const MAX_SIZE = 0.08;  // ignore "balls" wider than this fraction of the frame (e.g. bald heads)

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const octx = overlay.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const status = document.getElementById("status");
    const info = document.getElementById("info");

    // Square canvas used to letterbox each frame to 640x640 for the model
    const input = document.createElement("canvas");
    input.width = input.height = SIZE;
    const ictx = input.getContext("2d", { willReadFrequently: true });
    const pixels = new Float32Array(3 * SIZE * SIZE); // reused every frame instead of reallocating

    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
    let session, backend;

    // Try the GPU first, fall back to CPU (WASM)
    (async function loadModel() {
      for (const ep of ["webgpu", "wasm"]) {
        try {
          session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: [ep] });
          backend = ep;
          break;
        } catch (err) {
          console.warn(`${ep} failed:`, err);
        }
      }
      if (!session) {
        status.textContent = "Could not load model. Is model/best.onnx in place?";
        return;
      }
      status.textContent = `Model loaded (${backend})`;
      startBtn.disabled = false;
      startBtn.textContent = "Start camera";
    })();

    startBtn.addEventListener("click", async () => {
      try {
        // 4:3 is the native sensor shape on most phones, so it avoids cropping (wider view than 16:9)
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1920 },
            height: { ideal: 1440 },
            aspectRatio: { ideal: 4 / 3 },
            frameRate: { ideal: 60 }, // more frames = fewer missed bounces
          },
          audio: false,
        });
        video.srcObject = stream;

        // Zoom out fully if the camera supports it (widest field of view)
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
        }

        const s = track.getSettings();
        status.textContent = `Model: ${backend} | Camera: ${s.width}x${s.height}` + (caps.zoom ? " (zoomed out)" : "");
        startBtn.style.display = "none";

        video.addEventListener("loadedmetadata", startDetecting, { once: true });
        if (video.readyState >= 1) startDetecting();
      } catch (err) {
        status.textContent = "Camera error: " + err.message;
      }
    });

    let detecting = false;
    function startDetecting() {
      if (detecting) return; // loadedmetadata and readyState can both fire
      detecting = true;
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      netX = overlay.width / 2; // default until the user taps to calibrate
      lastFrameTime = performance.now();
      requestAnimationFrame(loop);
    }

    // ---------- Model ----------

    // Resize frame into 640x640 with grey padding (same as YOLO training), as a CHW float tensor
    function preprocess() {
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.min(SIZE / vw, SIZE / vh);
      const w = Math.round(vw * scale), h = Math.round(vh * scale);
      const dx = (SIZE - w) / 2, dy = (SIZE - h) / 2;

      ictx.fillStyle = "rgb(114,114,114)";
      ictx.fillRect(0, 0, SIZE, SIZE);
      ictx.drawImage(video, dx, dy, w, h);

      const { data } = ictx.getImageData(0, 0, SIZE, SIZE);
      const n = SIZE * SIZE;
      for (let i = 0; i < n; i++) {
        pixels[i] = data[i * 4] / 255;
        pixels[i + n] = data[i * 4 + 1] / 255;
        pixels[i + 2 * n] = data[i * 4 + 2] / 255;
      }
      return { tensor: new ort.Tensor("float32", pixels, [1, 3, SIZE, SIZE]), scale, dx, dy };
    }

    // Model output is [1, 5, 8400]: for each of 8400 candidates -> cx, cy, w, h, score
    function postprocess(out, { scale, dx, dy }) {
      const d = out.data, N = out.dims[2];
      const boxes = [];
      for (let i = 0; i < N; i++) {
        const score = d[4 * N + i];
        if (score < CONF_KEEP) continue;
        const w = d[2 * N + i] / scale, h = d[3 * N + i] / scale;
        if (Math.max(w, h) > MAX_SIZE * video.videoWidth) continue; // too big to be a ping pong ball
        const cx = (d[i] - dx) / scale, cy = (d[N + i] - dy) / scale;
        boxes.push({ x: cx - w / 2, y: cy - h / 2, w, h, cx, cy, score });
      }
      return nms(boxes.sort((a, b) => b.score - a.score));
    }

    function iou(a, b) {
      const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
      const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      return inter / (a.w * a.h + b.w * b.h - inter);
    }

    function nms(boxes) {
      const keep = [];
      for (const b of boxes) {
        if (keep.every(k => iou(k, b) < IOU)) keep.push(b);
      }
      return keep;
    }

    // ---------- Ignore stationary balls: only a moving ball is tracked ----------
    const LOST_MS = 500;        // forget a ball that is unseen for this long
    const STILL_MS = 600;       // a detection that stays put this long is a resting ball, not the one in play
    const STILL_RADIUS = 0.02;  // "stays put" = within this fraction of frame width
    let spots = [];             // { x, y, since, lastSeen } for each place a ball has been sitting

    function markStill(boxes, now) {
      const r = STILL_RADIUS * overlay.width;
      spots = spots.filter(s => now - s.lastSeen < LOST_MS);
      for (const b of boxes) {
        let spot = spots.find(s => Math.hypot(b.cx - s.x, b.cy - s.y) < r);
        if (!spot) { spot = { x: b.cx, y: b.cy, since: now, lastSeen: now }; spots.push(spot); }
        spot.lastSeen = now;
        b.still = now - spot.since > STILL_MS;
      }
    }

    // ---------- Tracking: follow one ball from frame to frame ----------
    // A detection only becomes "the ball" after it has been seen in a few frames in a row, moving
    // along a consistent path. One-frame flickers and false detections never get to score.
    const CONFIRM_HITS = 3;      // detections in a row needed before a new track is trusted
    const CONFIRM_MOVE = 0.03;   // ...and it must have moved this fraction of the frame width
    const GATE_BASE = 0.05;      // a detection joins a track if within this fraction of the frame width of the prediction...
    const GATE_SPEED = 2.5;      // ...plus this many times the distance the ball travelled since it was last seen
    const GATE_MAX = 0.35;       // never jump further than this fraction of the frame width
    const NEW_SPEED = 0.003;     // assumed speed of a brand-new track, in frame widths per ms
    const TENTATIVE_MS = 250;    // drop an unconfirmed track not seen for this long
    const MAX_TRACKS = 8;

    let tracks = [];             // { x, y, vx, vy, hits, startX, startY, lastSeen, confirmed }
    let ball = null;             // the confirmed track being followed

    function updateTracks(boxes, now) {
      const W = overlay.width;
      const free = boxes.filter(b => !b.still);

      // Established tracks pick their detection first
      tracks.sort((a, b) => b.confirmed - a.confirmed || b.hits - a.hits);
      for (const t of tracks) {
        const dt = Math.max(1, now - t.lastSeen);
        const speed = t.hits > 1 ? Math.hypot(t.vx, t.vy) : NEW_SPEED * W;
        const px = t.x + t.vx * dt, py = t.y + t.vy * dt;
        let best = null, bestD = Math.min(GATE_MAX * W, GATE_BASE * W + GATE_SPEED * speed * dt);
        for (const b of free) {
          if (b.track) continue;
          if (!t.confirmed && b.score < CONF_NEW) continue; // weak detections only extend a trusted track
          const d = Math.hypot(b.cx - px, b.cy - py);
          if (d < bestD) { best = b; bestD = d; }
        }
        if (!best) continue;

        best.track = t;
        const vx = (best.cx - t.x) / dt, vy = (best.cy - t.y) / dt;
        t.vx = t.hits > 1 ? 0.3 * t.vx + 0.7 * vx : vx;
        t.vy = t.hits > 1 ? 0.3 * t.vy + 0.7 * vy : vy;
        t.x = best.cx;
        t.y = best.cy;
        t.lastSeen = now;
        t.hits++;
        if (!t.confirmed && t.hits >= CONFIRM_HITS &&
            Math.hypot(t.x - t.startX, t.y - t.startY) > CONFIRM_MOVE * W) t.confirmed = true;
      }

      // Confident leftovers start new candidate tracks
      for (const b of free) {
        if (b.track || b.score < CONF_NEW) continue;
        b.track = { x: b.cx, y: b.cy, vx: 0, vy: 0, hits: 1, startX: b.cx, startY: b.cy, lastSeen: now, confirmed: false };
        tracks.push(b.track);
      }

      tracks = tracks
        .filter(t => now - t.lastSeen < (t.confirmed ? LOST_MS : TENTATIVE_MS))
        .slice(0, MAX_TRACKS);

      if (!tracks.includes(ball)) {
        ball = tracks.filter(t => t.confirmed).sort((a, b) => b.hits - a.hits)[0] || null;
      }
    }

    function resetTracking() {
      tracks = [];
      spots = [];
      ball = null;
    }

    // ---------- Ball events: bounces and hits ----------
    const MIN_MOVE = 0.015;     // ball must move this fraction of the frame before a direction change counts
    const MARK_MS = 400;        // how long a bounce/hit flash stays on screen
    const HIT_WINDOW_MS = 200;  // a "bounce" this close to a left/right reversal was really a bat hit
    const BOUNCE_GAP_MS = 150;  // two bounces closer than this are the same bounce
    const TABLE_BAND = 0.08;    // bounces must be within this fraction of frame height from the table line
    const IDLE_MOVE = 0.02;     // moving less than this fraction of the frame counts as "still"

    let followed = null;        // the track the axes/trail below belong to
    let axes = null;            // { x: axisState, y: axisState }
    const trail = [];           // recent ball centres, for drawing
    const marks = [];           // recent bounce/hit points, for flashing
    let pendingBounce = null;   // bounce on hold until we know it wasn't a bat hit
    let lastHitTime = -Infinity, lastBounceTime = -Infinity;
    let anchor = null;          // last position where the ball was considered "moving"
    let lastMotion = performance.now();

    let netX = 0, tableY = null; // set by tapping the table under the net

    document.getElementById("stage").addEventListener("click", (e) => {
      if (!video.videoWidth) return; // camera not started yet
      const r = overlay.getBoundingClientRect();
      netX = ((e.clientX - r.left) / r.width) * overlay.width;
      tableY = ((e.clientY - r.top) / r.height) * overlay.height;
      message = "Calibrated";
    });

    const sideOf = (x) => (x < netX ? 0 : 1); // 0 = P1 (left), 1 = P2 (right)
    const nearTable = (y) => tableY !== null && Math.abs(y - tableY) < TABLE_BAND * overlay.height;

    // Tracks movement on one axis with hysteresis. Returns the turning point when direction reverses.
    // a.dir: +1 increasing, -1 decreasing, 0 unknown. a.ext: furthest point reached in the current direction.
    function axisTurn(a, v, min) {
      if (a.dir === 0) {
        if (Math.abs(v - a.ext) > min) { a.dir = Math.sign(v - a.ext); a.ext = v; }
        return null;
      }
      if ((v - a.ext) * a.dir > 0) { a.ext = v; return null; } // still moving the same way
      if (Math.abs(v - a.ext) > min) {                         // reversed by enough to be real
        const turn = { from: a.dir, at: a.ext };
        a.dir = -a.dir;
        a.ext = v;
        return turn;
      }
      return null;
    }

    function updateBall(now) {
      // A held bounce with no bat hit right after it is a real table bounce
      if (pendingBounce && now - pendingBounce.t > HIT_WINDOW_MS) {
        const b = pendingBounce;
        pendingBounce = null;
        marks.push({ x: b.x, y: b.y, color: "red", t: now });
        onBounce(sideOf(b.x));
      }

      // A different ball (or none): its path has nothing to do with the old one
      if (ball !== followed) {
        followed = ball;
        axes = null;
        anchor = null;
        pendingBounce = null;
        trail.length = 0;
      }
      if (!ball || ball.lastSeen !== now) return; // not seen this frame

      const { x, y } = ball;
      trail.push({ x, y });
      if (trail.length > 20) trail.shift();

      if (!anchor || Math.hypot(x - anchor.x, y - anchor.y) > IDLE_MOVE * overlay.width) {
        anchor = { x, y };
        lastMotion = now;
      }
      onBallSeen(sideOf(x));

      if (!axes) {
        axes = { x: { dir: 0, ext: x }, y: { dir: 0, ext: y } };
        return;
      }

      // Left/right reversal = a bat hit, on the side where it turned
      const tx = axisTurn(axes.x, x, MIN_MOVE * overlay.width);
      if (tx) {
        lastHitTime = now;
        pendingBounce = null; // that "bounce" was the bat
        marks.push({ x: tx.at, y, color: "deepskyblue", t: now });
        onHit(sideOf(tx.at));
      }
      // Image y grows downward: falling (+1) then rising, near the table = bounce
      const ty = axisTurn(axes.y, y, MIN_MOVE * overlay.height);
      if (ty && ty.from === 1 && now - lastHitTime > HIT_WINDOW_MS && now - lastBounceTime > BOUNCE_GAP_MS && nearTable(ty.at)) {
        lastBounceTime = now;
        pendingBounce = { x, y: ty.at, t: now };
      }
    }

    // ---------- Game rules: 11 points, win by 2, 2 serves each, 1 each from 10-10 ----------
    const SERVE_PAUSE_MS = 3000; // ball still/hidden this long before a serve is accepted
    const RALLY_END_MS = 1500;   // ball still/gone this long ends the rally
    const SERVE_CROSS_MS = 1500; // a serve must cross the net this soon after its first bounce
    const PAUSE_GAP_MS = 1000;   // a gap this long between frames (tab hidden, camera stall) cancels the rally
    const NAMES = ["P1", "P2"];
    const STORE_KEY = "pingpong-match";

    let score = [0, 0], games = [0, 0], firstServer = 0;
    let history = [];            // snapshots for Undo
    let state = "waiting";       // waiting -> ready -> rally -> waiting
    let rally = null;            // { lastHitter, target, bounced, hits, reached, start }
    let message = "";
    let auto = true;

    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved) ({ score, games, firstServer } = saved);
    } catch {}

    const autoReady = () => auto && tableY !== null;

    function server() {
      const total = score[0] + score[1];
      const turns = total < 20 ? Math.floor(total / 2) : 10 + (total - 20);
      return (firstServer + turns) % 2;
    }

    function onBallSeen(side) {
      if (state === "rally" && side === rally.target) rally.reached = true;
    }

    function onBounce(side) {
      if (!autoReady()) return;
      if (state === "ready") {
        // Serve starts with a bounce on the server's own side. Anything else (hand pass, drop) is ignored.
        if (side === server()) {
          const s = server();
          rally = { lastHitter: s, target: 1 - s, bounced: false, hits: 0, reached: false, start: performance.now() };
          state = "rally";
          message = "";
        }
        return;
      }
      if (state !== "rally") return;

      if (side !== rally.target) {
        // Extra bounces on the server's side before the ball crosses = server just bouncing it, ignore
        if (rally.hits === 0 && !rally.reached) return;
        return endRally(rally.target, `${NAMES[rally.lastHitter]} bounced on own side`);
      }
      if (rally.bounced) return endRally(rally.lastHitter, `double bounce on ${NAMES[side]}'s side`);
      rally.bounced = true;
    }

    function onHit(side) {
      if (!autoReady() || state !== "rally" || side !== rally.target || !rally.reached) return; // own-side reversal = noise
      // A return. If we missed seeing its bounce (low FPS), assume it bounced rather than calling a fault.
      rally.lastHitter = side;
      rally.target = 1 - side;
      rally.bounced = false;
      rally.reached = false;
      rally.hits++;
    }

    function cancelRally(reason) {
      state = "waiting";
      rally = null;
      message = reason;
    }

    function updateGame(now) {
      if (!autoReady()) {
        if (state !== "waiting") cancelRally(auto ? "" : "Auto scoring off");
        lastMotion = now; // so turning auto on still needs a fresh pause before serving
        return;
      }
      if (state === "waiting" && now - lastMotion > SERVE_PAUSE_MS) state = "ready";
      if (state !== "rally") return;

      if (rally.hits === 0 && !rally.reached && now - rally.start > SERVE_CROSS_MS) {
        return cancelRally("No serve, ignored"); // hand pass or practice bounce
      }
      if (now - lastMotion > RALLY_END_MS) {
        if (rally.hits === 0 && !rally.reached) cancelRally("No serve, ignored");
        else if (rally.bounced) endRally(rally.lastHitter, `${NAMES[rally.target]} missed`);
        else endRally(rally.target, `${NAMES[rally.lastHitter]} hit out or into the net`);
      }
    }

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify({ score, games, firstServer }));
    }

    function flash(p) {
      const el = document.getElementById(`player${p}`);
      el.classList.remove("scored");
      void el.offsetWidth; // restart the animation
      el.classList.add("scored");
      if (navigator.vibrate) navigator.vibrate(80);
    }

    function endRally(winner, reason) {
      history.push({ score: [...score], games: [...games], firstServer });
      score[winner]++;
      message = `Point ${NAMES[winner]}: ${reason}`;

      const [a, b] = score;
      if (Math.max(a, b) >= 11 && Math.abs(a - b) >= 2) {
        games[winner]++;
        message = `${NAMES[winner]} wins the game ${a}-${b}!`;
        score = [0, 0];
        firstServer = 1 - firstServer; // other player serves first next game
      }
      state = "waiting";
      rally = null;
      lastMotion = performance.now(); // need a fresh 3 s pause before the next serve (ignores hand passes)
      flash(winner);
      save();
    }

    function restart(msg) {
      state = "waiting";
      rally = null;
      message = msg;
      lastMotion = performance.now();
      save();
    }

    document.querySelectorAll(".plus").forEach((btn) =>
      btn.addEventListener("click", () => endRally(+btn.dataset.player, "added manually"))
    );

    document.getElementById("undoBtn").addEventListener("click", () => {
      const prev = history.pop();
      if (!prev) return;
      ({ score, games, firstServer } = prev);
      restart("Undone");
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Reset the whole match?")) return;
      score = [0, 0]; games = [0, 0]; firstServer = 0; history = [];
      restart("");
    });

    document.getElementById("serverBtn").addEventListener("click", () => {
      history.push({ score: [...score], games: [...games], firstServer });
      firstServer = 1 - firstServer;
      restart(`${NAMES[server()]} serves`);
    });

    const autoBtn = document.getElementById("autoBtn");
    autoBtn.addEventListener("click", () => {
      auto = !auto;
      autoBtn.textContent = `Auto: ${auto ? "on" : "off"}`;
      message = auto ? "" : "Auto scoring off";
    });

    const stateEl = document.getElementById("state");
    const noteEl = document.getElementById("note");
    let lastBoard = "";

    function gameNote() {
      const [a, b] = score;
      if (a >= 10 && a === b) return "Deuce";
      if (Math.max(a, b) >= 10 && a !== b) return `Game point ${NAMES[a > b ? 0 : 1]}`;
      return "";
    }

    function renderBoard() {
      const s = server();
      let text;
      if (!auto) text = "Manual scoring";
      else if (tableY === null) text = "Tap the table right under the net to start auto scoring";
      else if (state === "waiting") text = "Hold the ball still to serve…";
      else if (state === "ready") text = `${NAMES[s]} to serve`;
      else text = `Rally: ${rally.hits} returns`;
      text = message ? `${message} · ${text}` : text;

      const key = `${score}|${games}|${s}|${text}`;
      if (key === lastBoard) return; // nothing changed, skip DOM writes
      lastBoard = key;
      for (const p of [0, 1]) {
        document.getElementById(`pts${p}`).textContent = score[p];
        document.getElementById(`games${p}`).textContent = games[p];
        document.getElementById(`player${p}`).classList.toggle("serving", p === s);
      }
      stateEl.textContent = text;
      noteEl.textContent = gameNote();
    }

    // ---------- Drawing ----------
    function draw(boxes) {
      octx.clearRect(0, 0, overlay.width, overlay.height);
      octx.lineWidth = Math.max(2, overlay.width / 250);
      const fontSize = Math.max(14, overlay.width / 40);
      octx.font = `${fontSize}px sans-serif`;
      octx.textBaseline = "top";
      const pad = fontSize * 0.2, lh = fontSize + pad * 2;
      const placed = []; // label rects already drawn, so new ones don't overlap them

      for (const b of boxes) {
        // Green = the ball being followed, white = candidate, gray = resting ball (ignored)
        const followedBall = ball && b.track === ball;
        const color = b.still ? "gray" : followedBall ? "lime" : "white";
        const label = b.still ? "still" : followedBall ? "ball" : "?";
        octx.strokeStyle = color;
        octx.strokeRect(b.x, b.y, b.w, b.h);

        const text = `${label} ${(b.score * 100) | 0}%`;
        const lw = octx.measureText(text).width + pad * 2;
        // Above the box if there is room, otherwise inside its top; kept within the frame
        let lx = Math.min(Math.max(0, b.x), overlay.width - lw);
        let ly = b.y - lh >= 0 ? b.y - lh : Math.max(0, b.y);
        // Move down until it no longer overlaps an earlier label
        while (placed.some(p => lx < p.x + p.w && lx + lw > p.x && ly < p.y + p.h && ly + lh > p.y)) {
          ly += lh;
        }
        placed.push({ x: lx, y: ly, w: lw, h: lh });

        octx.fillStyle = "rgba(0, 0, 0, 0.7)";
        octx.fillRect(lx, ly, lw, lh);
        octx.fillStyle = color;
        octx.fillText(text, lx + pad, ly + pad);
      }
    }

    function drawTracking(now) {
      // Net (left/right split) and table line
      octx.save();
      octx.setLineDash([12, 10]);
      octx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      octx.lineWidth = Math.max(2, overlay.width / 400);
      octx.beginPath();
      octx.moveTo(netX, 0);
      octx.lineTo(netX, overlay.height);
      if (tableY !== null) {
        octx.moveTo(0, tableY);
        octx.lineTo(overlay.width, tableY);
      }
      octx.stroke();
      octx.restore();

      octx.strokeStyle = "yellow";
      octx.lineWidth = Math.max(2, overlay.width / 300);
      octx.beginPath();
      trail.forEach((p, i) => (i ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y)));
      octx.stroke();

      while (marks.length && now - marks[0].t > MARK_MS) marks.shift();
      for (const m of marks) {
        octx.fillStyle = m.color;
        octx.beginPath();
        octx.arc(m.x, m.y, overlay.width / 40, 0, Math.PI * 2);
        octx.fill();
      }
    }

    // ---------- Main loop ----------
    let frames = 0, lastFpsTime = performance.now(), fps = 0, lastFrameTime = 0;

    async function loop() {
      const t0 = performance.now();

      // After a long gap the ball's path is unknown: drop it rather than score a "missed" ball
      if (t0 - lastFrameTime > PAUSE_GAP_MS) {
        resetTracking();
        if (state === "rally") cancelRally("Paused, rally cancelled");
        lastMotion = t0;
      }
      lastFrameTime = t0;

      const prep = preprocess();
      const results = await session.run({ [session.inputNames[0]]: prep.tensor });
      const boxes = postprocess(results[session.outputNames[0]], prep);

      markStill(boxes, t0);
      updateTracks(boxes, t0);
      draw(boxes);
      updateBall(t0);
      updateGame(t0);
      drawTracking(t0);
      renderBoard();

      frames++;
      if (t0 - lastFpsTime > 1000) {
        fps = (frames * 1000) / (t0 - lastFpsTime);
        frames = 0;
        lastFpsTime = t0;
      }
      info.textContent = `Detections: ${boxes.length} | Ball: ${ball ? "tracked" : "none"} | ${fps.toFixed(1)} FPS | ${(performance.now() - t0).toFixed(0)} ms/frame`;
      requestAnimationFrame(loop);
    }

    renderBoard();
  </script>
</body>
</html>
